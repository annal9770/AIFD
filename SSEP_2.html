<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>New Patch Variation</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --text: #2B211B;
      --accent: #E8A8B8;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans Pro', sans-serif;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sparkle {
      position: absolute;
      color: var(--accent);
      opacity: .2;
      font-size: 18px;
      animation: twinkle 6s ease-in-out infinite;
    }
    .sparkle:nth-child(2n) { animation-duration: 8s; }
    .sparkle:nth-child(3n) { animation-duration: 5s; }
    .sparkle:nth-child(4n) { animation-delay: -3s; }
    .sparkle:nth-child(5n) { animation-delay: -5s; }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.7) rotate(0deg); }
      50% { opacity: .35; transform: scale(1.15) rotate(12deg); }
    }
    .wrapper {
      max-width: 1200px;
      margin: auto;
      padding: 96px 24px;
      position: relative;
      z-index: 1;
    }
    h1 {
      font-family: Oswald, sans-serif;
      font-size: clamp(72px, 10vw, 120px);
      text-align: center;
      margin: 0;
    }
    .sub {
      text-align: center;
      font-size: 24px;
      margin: 8px 0 48px;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 520px);
      justify-content: center;
      gap: 32px;
    }
    .thumb {
      width: 100%;
      height: 460px;
      object-fit: cover;
      border-radius: 24px;
      cursor: pointer;
      transition: transform .3s ease-out, box-shadow .3s ease-out, filter .3s ease-out;
    }
    .thumb:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 16px 36px rgba(43, 33, 27, .18);
      filter: brightness(1.04);
    }
    .label {
      margin-top: 28px;
      margin-bottom: 16px;
      font-family: 'Source Sans Pro', sans-serif;
      text-align: center;
    }
    .num {
      color: var(--accent);
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43, 33, 27, .94);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 64px;
      cursor: pointer;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: var(--text);
      font-size: 34px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .3s ease-out, box-shadow .3s ease-out;
    }
    .nav-arrow:hover {
      transform: translateY(-50%) scale(1.08);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .25);
    }
    .prev { left: 24px; }
    .next { right: 24px; }
    @media(max-width: 768px) {
      .nav-arrow { width: 48px; height: 48px; font-size: 28px; }
      .prev { left: 12px; }
      .next { right: 12px; }
      .thumb { height: 340px; }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="left:7%;top:12%">✦</span>
    <span class="sparkle" style="left:18%;top:67%">✧</span>
    <span class="sparkle" style="left:31%;top:26%">✦</span>
    <span class="sparkle" style="left:44%;top:82%">✧</span>
    <span class="sparkle" style="left:58%;top:16%">✦</span>
    <span class="sparkle" style="left:69%;top:55%">✧</span>
    <span class="sparkle" style="left:83%;top:32%">✦</span>
    <span class="sparkle" style="left:92%;top:75%">✧</span>
    <span class="sparkle" style="left:12%;top:90%">✦</span>
    <span class="sparkle" style="left:76%;top:91%">✦</span>
  </div>

  <div class="wrapper">
    <h1>New Patch Variation</h1>
    <p class="sub">the second variation sketch, changing the concept to more of a comet</p>
    <div id="gallery" class="grid"></div>
  </div>

  <div id="lb" class="lightbox">
    <div id="close" class="close">×</div>
    <button id="prev" class="nav-arrow prev" aria-label="Previous image">‹</button>
    <img id="big">
    <button id="next" class="nav-arrow next" aria-label="Next image">›</button>
  </div>

  <script>
    const images = ['space4.jpg'];
    const labels = [
      ["01", "Comet Variation Sketch"]
    ];

    let currentIndex = 0;
    const g = document.getElementById('gallery');

    images.forEach((img, i) => {
      const d = document.createElement('div');
      d.innerHTML = `<img class="thumb" src="${img}" alt="${labels[i][1]}"><div class="label"><span class="num">${labels[i][0]}</span> - ${labels[i][1]}</div>`;
      d.querySelector('.thumb').onclick = () => {
        currentIndex = i;
        document.getElementById('big').src = images[currentIndex];
        document.getElementById('lb').classList.add('active');
      };
      g.appendChild(d);
    });

    // Hide navigation arrows if there is only 1 image
    if (images.length <= 1) {
      document.getElementById('prev').style.display = 'none';
      document.getElementById('next').style.display = 'none';
    }

    const showImage = (step) => {
      currentIndex = (currentIndex + step + images.length) % images.length;
      document.getElementById('big').src = images[currentIndex];
    };

    document.getElementById('prev').onclick = () => showImage(-1);
    document.getElementById('next').onclick = () => showImage(1);

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lb').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') showImage(-1);
      if (e.key === 'ArrowRight') showImage(1);
      if (e.key === 'Escape') document.getElementById('lb').classList.remove('active');
    });

    document.getElementById('close').onclick = () => document.getElementById('lb').classList.remove('active');
  </script>
</body>
</html>
