<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chair Sequence</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#FAF7F2;--text:#2B211B;--accent:#E8A8B8}body{background:var(--bg);color:var(--text);font-family:'Source Sans Pro',sans-serif;margin:0;position:relative;overflow-x:hidden}.sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.sparkle{position:absolute;color:var(--accent);opacity:.2;font-size:18px;animation:twinkle 6s ease-in-out infinite}.sparkle:nth-child(2n){animation-duration:8s}.sparkle:nth-child(3n){animation-duration:5s}.sparkle:nth-child(4n){animation-delay:-3s}.sparkle:nth-child(5n){animation-delay:-5s}@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0deg)}50%{opacity:.35;transform:scale(1.15) rotate(12deg)}}.wrapper{max-width:1200px;margin:auto;padding:96px 24px;position:relative;z-index:1}h1{font-family:Oswald,sans-serif;font-size:clamp(72px,10vw,120px);text-align:center;margin:0}.sub{text-align:center;font-size:24px;margin:8px 0 48px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.thumb{width:100%;height:320px;object-fit:cover;border-radius:24px;cursor:pointer;transition:transform .3s ease-out,box-shadow .3s ease-out,filter .3s ease-out}.thumb:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 16px 36px rgba(43,33,27,.18);filter:brightness(1.04)}.label{margin-top:28px;margin-bottom:16px;font-family:'Source Sans Pro'}.num{color:var(--accent)}.btn{background:var(--accent);border:none;border-radius:16px;padding:14px 24px;cursor:pointer}.prompt{max-height:0;overflow:hidden;transition:max-height .4s ease;white-space:pre-wrap;margin-top:16px}.prompt.open{max-height:280px;overflow-y:auto;border:2px solid var(--accent);padding:24px;border-radius:16px}.lightbox{display:none;position:fixed;inset:0;background:rgba(43,33,27,.94);align-items:center;justify-content:center;z-index:9999}.lightbox.active{display:flex}.lightbox img{max-width:90vw;max-height:85vh}.close{position:absolute;top:20px;right:30px;color:white;font-size:64px;cursor:pointer}.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border:none;border-radius:50%;background:var(--accent);color:var(--text);font-size:34px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .3s ease-out,box-shadow .3s ease-out}.nav-arrow:hover{transform:translateY(-50%) scale(1.08);box-shadow:0 10px 26px rgba(0,0,0,.25)}.prev{left:24px}.next{right:24px}@media(max-width:768px){.nav-arrow{width:48px;height:48px;font-size:28px}.prev{left:12px}.next{right:12px}}@media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:768px){.grid{grid-template-columns:1fr}}</style></head><body><div class="sparkles" aria-hidden="true"><span class="sparkle" style="left:7%;top:12%">✦</span><span class="sparkle" style="left:18%;top:67%">✧</span><span class="sparkle" style="left:31%;top:26%">✦</span><span class="sparkle" style="left:44%;top:82%">✧</span><span class="sparkle" style="left:58%;top:16%">✦</span><span class="sparkle" style="left:69%;top:55%">✧</span><span class="sparkle" style="left:83%;top:32%">✦</span><span class="sparkle" style="left:92%;top:75%">✧</span><span class="sparkle" style="left:12%;top:90%">✦</span><span class="sparkle" style="left:76%;top:91%">✦</span></div><div class="wrapper"><h1>Chair Sequence</h1><p class="sub">one prompt, built up nine times</p><div id="gallery" class="grid"></div></div><div id="lb" class="lightbox"><div id="close" class="close">×</div><button id="prev" class="nav-arrow prev" aria-label="Previous image">‹</button><img id="big"><button id="next" class="nav-arrow next" aria-label="Next image">›</button></div><script>const images=['Designer.jpg','Designer (1).jpg','Designer (2).jpg','Designer (3).jpg','Designer (4).jpg','Designer (5).jpg','Designer (6).jpg','Designer (7).jpg','Designer (8).jpg'];const labels=[["01", "Original Chair"], ["02", "Initial Base Details"], ["03", "Setting Details"], ["04", "Art Style Details"], ["05", "Composition Details"], ["06", "Marked References"], ["07", "Marked Results"], ["08", "Different Generator"], ["09", "Final Edits"]];const prompts=["A chair in the middle of a room.", "A fluffy chair in the middle of a cafe room.", "Addition: There is pastries on tables but there is no one there. The sun is bright and illuminates the room. On the window, there rests a cat sleeping.", "Addition: The style is a cartoonish cozy crayon illustration.", "Addition: This is shot from the window, behind the cat with the lens looking into the cafe.", "Mark-Up Instructions: Add a sleeping cat on the fluffy chair. The \"Have a Nice Day\" sign should be changed into a clock. The blue rectangle underneath that should be an empty wooden shelf.", "Mark-Up Results", "Full A.I. Prompt for ChatGPT:\n\nA cozy cartoon crayon illustration viewed from outside a caf\u00e9 window, looking inward through the glass. In the foreground, a sleeping calico cat is curled up on a round windowsill cushion. Warm golden morning sunlight streams through the large window, filling the empty caf\u00e9 with glowing light and soft shadows.\n\nAt the center of the caf\u00e9 sits an anthropomorphic fluffy cream-colored sherpa armchair that is asleep. The chair has closed sleepy eyes, a tiny peaceful smile, rosy cheeks, and subtle \"Zzz\" symbols floating above it. A small sleeping cat is curled up on the chair's seat, also napping peacefully. The chair feels like a living cozy character, soft, fluffy, and content.\n\nThe caf\u00e9 is completely empty of people. Fresh pastries, croissants, cinnamon rolls, cookies, and baked goods rest neatly on wooden tables and inside a pastry display case.\n\nOn the back wall hangs a round wooden clock. Beneath the clock is an empty wooden floating shelf. Hanging plants, potted greenery, tulips, wooden furniture, and small flower vases create a warm and welcoming atmosphere.\n\nIllustrated in a whimsical storybook crayon style with visible wax crayon texture, hand-drawn sketch lines, layered colored-pencil shading, cozy children's book aesthetics, soft rounded shapes, warm honey-gold lighting, nostalgic charm, highly detailed yet simple and playful.\n\nComposition: window frame partially visible around the edges, foreground sleeping cat on the windowsill, sleeping fluffy chair centered in the room, second sleeping cat resting on the chair, strong depth and perspective looking from outside the window into the caf\u00e9. No people. No text. Peaceful quiet morning atmosphere.", "Final Edit Instructions: Making the chair visibly sleeping."];let currentIndex=0;const g=document.getElementById('gallery');images.forEach((img,i)=>{const d=document.createElement('div');d.innerHTML=`<img class="thumb" src="${img}"><div class="label"><span class="num">${labels[i][0]}</span> - ${labels[i][1]}</div><button class="btn">View Prompt</button><div class="prompt"></div>`;d.querySelector('.prompt').textContent=prompts[i];d.querySelector('.thumb').onclick=()=>{currentIndex=i;document.getElementById('big').src=images[currentIndex];document.getElementById('lb').classList.add('active')};d.querySelector('.btn').onclick=(e)=>{const p=d.querySelector('.prompt');p.classList.toggle('open');e.target.textContent=p.classList.contains('open')?'Hide Prompt':'View Prompt';};g.appendChild(d);});const showImage=(step)=>{currentIndex=(currentIndex+step+images.length)%images.length;document.getElementById('big').src=images[currentIndex];};document.getElementById('prev').onclick=()=>showImage(-1);document.getElementById('next').onclick=()=>showImage(1);document.addEventListener('keydown',(e)=>{if(!document.getElementById('lb').classList.contains('active'))return;if(e.key==='ArrowLeft')showImage(-1);if(e.key==='ArrowRight')showImage(1);if(e.key==='Escape')document.getElementById('lb').classList.remove('active');});document.getElementById('close').onclick=()=>document.getElementById('lb').classList.remove('active');</script></body></html>
