<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time for a Catnap</title>
  <style>
    :root {
      --wall-top: #e9c9a6;
      --wall-bottom: #c98764;
      --wood-dark: #633d2d;
      --wood: #9b6043;
      --cream: #fff3d7;
      --cat: #e8a45f;
      --cat-light: #f8c887;
      --cat-dark: #a9583d;
      --ink: #4b302d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      background: #6a4435;
    }

    button { font: inherit; }

    .cafe {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        linear-gradient(90deg, rgba(92, 54, 41, .10) 1px, transparent 1px),
        linear-gradient(var(--wall-top), var(--wall-bottom));
      background-size: 54px 100%, 100% 100%;
      transition: background 1.5s ease;
    }

    .cafe::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 24vh;
      background: repeating-linear-gradient(90deg, #724633 0 70px, #82513a 70px 73px);
      border-top: 9px solid #4d3027;
      z-index: 1;
    }

    .header {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 10;
      width: min(78vw, 720px);
      height: 112px;
      margin: 0;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1;
      filter: drop-shadow(0 3px 3px rgba(50, 25, 20, .20));
    }

    h1 {
      margin: 0;
      color: #4b302d;
      font-family: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2.25rem, 5.2vw, 4.15rem);
      font-weight: 800;
      line-height: .96;
      letter-spacing: -0.045em;
    }
    .subtitle {
      margin: 3px 0 0;
      color: #6a4038;
      font-family: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(.78rem, 1.5vw, .98rem);
      font-weight: 600;
      line-height: 1;
      text-align: center;
    }

    .lamp {
      position: absolute;
      top: 0;
      width: 130px;
      height: 150px;
      z-index: 5;
    }
    .lamp.left { left: 7%; }
    .lamp.right { right: 7%; }
    .lamp .cord { width: 4px; height: 75px; background: #432d28; margin: auto; }
    .lamp .shade {
      width: 90px; height: 50px; margin: 0 auto;
      border-radius: 50% 50% 10px 10px;
      background: #7d493a;
      box-shadow: 0 18px 30px 10px rgba(255, 207, 113, .23);
      clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%);
    }
    .lamp .bulb { width: 18px; height: 14px; border-radius: 50%; background: #ffe7a0; margin: -3px auto; box-shadow: 0 0 22px #ffd979; }

    .window-wrap {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      width: min(72vw, 680px);
      height: min(43vh, 355px);
      padding: 15px;
      border: 12px solid #704533;
      border-radius: 8px;
      background: #4a2d26;
      box-shadow: 0 14px 35px rgba(63, 34, 27, .35), inset 0 0 0 4px #bb7a54;
      z-index: 2;
    }

    .window {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden;
      background: linear-gradient(#88cdec, #ffdf9f);
      transition: background 1.5s ease;
    }

    .window::before, .window::after {
      content: ""; position: absolute; z-index: 7; background: #714735;
    }
    .window::before { width: 13px; height: 100%; left: calc(50% - 6px); }
    .window::after { height: 13px; width: 100%; top: calc(50% - 6px); }

    .sun-moon {
      position: absolute;
      left: 15%; top: 17%;
      width: 64px; height: 64px;
      border-radius: 50%;
      background: #fff2ad;
      box-shadow: 0 0 35px #ffe77c;
      transition: all 1.5s ease;
    }

    .stars { position: absolute; inset: 0; opacity: 0; transition: opacity 1s; }
    .star { position: absolute; color: white; animation: twinkle 2s infinite alternate; }
    .star:nth-child(1) { left: 12%; top: 20%; }
    .star:nth-child(2) { left: 37%; top: 12%; animation-delay: .5s; }
    .star:nth-child(3) { left: 67%; top: 24%; animation-delay: 1s; }
    .star:nth-child(4) { left: 84%; top: 10%; }
    .star:nth-child(5) { left: 55%; top: 40%; animation-delay: .8s; }
    @keyframes twinkle { to { opacity: .35; transform: scale(.7); } }

    .cloud {
      position: absolute;
      width: 105px; height: 27px;
      border-radius: 30px;
      background: rgba(255,255,255,.7);
      animation: drift 22s linear infinite;
    }
    .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
    .cloud::before { width: 45px; height: 45px; left: 18px; bottom: 3px; }
    .cloud::after { width: 57px; height: 57px; right: 12px; bottom: 0; }
    .cloud.one { top: 31%; left: -130px; }
    .cloud.two { top: 16%; left: -170px; transform: scale(.7); animation-delay: -11s; }
    @keyframes drift { to { left: calc(100% + 140px); } }

    .city {
      position: absolute; inset: auto 0 0; height: 33%;
      background: linear-gradient(90deg, #58473f 0 10%, #6b5145 10% 18%, #453c38 18% 31%, #715143 31% 43%, #4b403b 43% 55%, #634b42 55% 68%, #3f3937 68% 82%, #61483f 82%);
      clip-path: polygon(0 35%, 10% 35%, 10% 12%, 18% 12%, 18% 45%, 31% 45%, 31% 20%, 43% 20%, 43% 52%, 55% 52%, 55% 5%, 68% 5%, 68% 40%, 82% 40%, 82% 17%, 94% 17%, 94% 42%, 100% 42%, 100% 100%, 0 100%);
      opacity: .85;
    }

    .plant {
      position: absolute;
      bottom: calc(7vh + 105px);
      z-index: 4;
      width: 100px;
      height: 170px;
    }
    .plant.left { left: 3%; }
    .plant.right { right: 3%; transform: scaleX(-1); }
    .pot { position: absolute; bottom: 0; left: 25px; width: 60px; height: 55px; background: #a75f46; clip-path: polygon(0 0,100% 0,85% 100%,15% 100%); }

    /* These soft-edged wooden tables stand on the floor and support the plants. */
    .plant-table {
      position: absolute;
      bottom: 7vh;
      z-index: 3;
      width: 128px;
      height: 105px;
    }
    .plant-table.left { left: 1.7%; }
    .plant-table.right { right: 1.7%; }
    .plant-table .tabletop {
      position: absolute;
      top: 0;
      left: 0;
      width: 128px;
      height: 18px;
      border-radius: 7px;
      background: linear-gradient(#bd805a, #8f5940);
      box-shadow: 0 4px 6px rgba(55, 28, 21, .18);
    }
    .plant-table .leg {
      position: absolute;
      top: 15px;
      width: 13px;
      height: 90px;
      border: 0;
      border-radius: 0 0 4px 4px;
      background: linear-gradient(90deg, #81513c, #9a654a);
    }
    .plant-table .leg.one { left: 18px; transform: rotate(1deg); }
    .plant-table .leg.two { right: 18px; transform: rotate(-1deg); }
    .plant-table .brace {
      position: absolute;
      left: 25px;
      top: 61px;
      width: 78px;
      height: 9px;
      border: 0;
      border-radius: 4px;
      background: #8e5b43;
    }
    .leaf { position: absolute; width: 40px; height: 75px; border-radius: 100% 0 100% 0; background: #55754f; transform-origin: bottom; }
    .leaf.a { left: 35px; top: 45px; transform: rotate(-28deg); }
    .leaf.b { left: 50px; top: 18px; transform: rotate(15deg); }
    .leaf.c { left: 16px; top: 58px; transform: rotate(-57deg); }

    .shelf {
      position: absolute; left: 3%; top: 205px; width: 185px; height: 20px; background: #704735; box-shadow: 0 7px 0 #4d3027; z-index: 3;
    }
    .shelf-item { position: absolute; bottom: 20px; border-radius: 5px 5px 0 0; }
    .jar1 { left: 15px; width: 36px; height: 49px; background: #e8d0a5; }
    .jar2 { left: 61px; width: 32px; height: 62px; background: #b66d58; }
    .cups { left: 113px; width: 46px; height: 28px; background: #719b91; border-radius: 0 0 12px 12px; box-shadow: 0 -12px 0 #e6b893; }

    .clock-board {
      position: absolute; top: 165px; right: 3%; z-index: 4;
      min-width: 190px; padding: 13px 19px;
      border: 8px solid #714735; border-radius: 6px;
      color: #fff2be; background: #263d35;
      text-align: center; box-shadow: 0 8px 18px rgba(40,20,15,.3);
    }
    .clock-board small { display: block; font: .75rem Arial, sans-serif; letter-spacing: 2px; }
    #clock { font-size: clamp(1.45rem, 3vw, 2.25rem); font-variant-numeric: tabular-nums; }
    #period { margin-top: 3px; color: #d7a679; font: .8rem Arial, sans-serif; }

    .counter {
      position: absolute; z-index: 9; left: 50%; bottom: 8vh; transform: translateX(-50%);
      width: min(94vw, 820px); height: 225px;
      border-radius: 25px 25px 0 0;
      background: linear-gradient(#bd805a 0 18px, #8a553e 18px 100%);
      box-shadow: 0 -6px 0 #deb084, 0 16px 26px rgba(50, 25, 20, .4);
    }
    .counter::after { content: ""; position: absolute; inset: 53px 6% 0; border: 4px solid rgba(74,42,34,.35); border-bottom: none; }

    .cat-button {
      position: absolute; left: 50%; top: -130px; transform: translateX(-50%);
      width: 460px; height: 190px; padding: 0; border: 0; background: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .cat-button:focus-visible { outline: 4px solid #fff1a8; border-radius: 90px; }

    .cat-body {
      position: absolute; left: 100px; top: 48px; width: 285px; height: 125px;
      border: 0; border-radius: 55% 48% 42% 48%;
      background: var(--cat); box-shadow: inset 0 -17px 0 rgba(196,105,65,.20), 0 12px 18px rgba(91,48,34,.18);
      overflow: hidden;
      clip-path: inset(0 round 55% 48% 42% 48%);
      animation: breathe 3.5s ease-in-out infinite;
      transform-origin: bottom;
    }
    @keyframes breathe { 50% { transform: scaleY(1.035) translateY(-2px); } }

    .stripe { position: absolute; height: 9px; width: 46px; background: var(--cat-dark); border-radius: 10px; transform: rotate(68deg); }
    .stripe.s1 { left: 98px; top: 10px; width: 40px; }
    .stripe.s2 { left: 134px; top: 12px; }
    .stripe.s3 { left: 170px; top: 15px; width: 44px; }
    .stripe.s4 { left: 196px; top: 8px; width: 53px; }

    .cat-head {
      position: absolute; left: 48px; top: 50px; width: 120px; height: 108px;
      border: 0; border-radius: 48% 48% 45% 45%; background-color: var(--cat); z-index: 4;
      box-shadow: inset 0 -10px 0 rgba(196,105,65,.14);
    }
    .ear {
      position: absolute; top: -27px; width: 50px; height: 58px; background: var(--cat); border: 0; z-index: -1;
    }
    .ear::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 13px;
      width: 20px;
      height: 25px;
      background: #dc8179;
      opacity: .68;
      transform: translateX(-50%);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border-radius: 45% 45% 28% 28%;
    }
    .ear.left { left: 4px; transform: rotate(-14deg); clip-path: polygon(0 100%, 45% 0, 100% 100%); }
    .ear.right { right: 4px; transform: rotate(14deg); clip-path: polygon(0 100%, 55% 0, 100% 100%); }

    /* Three separate forehead stripes stay clearly visible inside the rounded face. */
    .forehead-mark {
      position: absolute;
      top: 3px;
      width: 8px;
      height: 22px;
      background: var(--cat-dark);
      border-radius: 0 0 8px 8px;
    }
    .forehead-mark.center { left: 56px; }
    .forehead-mark.left {
      left: 39px;
      height: 19px;
      transform: rotate(-14deg);
      transform-origin: top center;
    }
    .forehead-mark.right {
      left: 73px;
      height: 19px;
      transform: rotate(14deg);
      transform-origin: top center;
    }

    /* The cat begins asleep with gently curved closed eyes. */
    .eye {
      position: absolute;
      top: 48px;
      width: 25px;
      height: 11px;
      border: 0;
      border-bottom: 3px solid rgba(75,48,45,.72);
      border-radius: 50%;
      background: transparent;
      transition: top .28s ease, width .28s ease, height .28s ease, background .28s ease, border .28s ease;
      transform-origin: center;
    }
    .eye.left { left: 20px; }
    .eye.right { right: 20px; }

    /* Clicking the cat opens its eyes and starts a soft blinking animation. */
    .cat-button.awake .eye {
      top: 43px;
      width: 22px;
      height: 25px;
      border: 0;
      border-radius: 50%;
      background: #4b302d;
      box-shadow: inset 0 -3px 0 rgba(27, 15, 14, .16);
      animation: awakeBlink 2.8s ease-in-out infinite;
    }
    .cat-button.awake .eye.left { left: 22px; }
    .cat-button.awake .eye.right { right: 22px; }
    .cat-button.awake .eye::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 6px;
      width: 6px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 244, 218, .88);
    }
    @keyframes awakeBlink {
      0%, 38%, 48%, 76%, 86%, 100% { transform: scaleY(1); }
      43%, 81% { transform: scaleY(.08); }
    }

    /* After five seconds without another click, the eyes softly return to rest. */
    .cat-button.resting .eye {
      animation: closeEyes .42s ease forwards;
    }
    @keyframes closeEyes {
      0% { transform: scaleY(1); }
      55% { transform: scaleY(.08); }
      100% { transform: scaleY(1); }
    }

    .nose { position: absolute; left: 53px; top: 66px; width: 14px; height: 10px; border-radius: 50% 50% 60% 60%; background: #b75f62; }
    .mouth { position: absolute; left: 50px; top: 72px; width: 23px; height: 15px; border-bottom: 2px solid rgba(75,48,45,.72); border-radius: 50%; }
    .cheek { position: absolute; top: 70px; width: 22px; height: 11px; border-radius: 50%; background: rgba(231,126,120,.45); }
    .cheek.left { left: 10px; } .cheek.right { right: 10px; }
    .whiskers { position: absolute; top: 66px; width: 48px; height: 35px; }
    .whiskers.left { right: calc(100% - 9px); }
    .whiskers.right { left: calc(100% - 9px); transform: scaleX(-1); }
    .whiskers i { position: absolute; right: -2px; width: 48px; height: 2px; background: rgba(75,48,45,.58); transform-origin: right; border-radius: 2px; }
    .whiskers i:nth-child(1) { top: 4px; transform: rotate(8deg); }
    .whiskers i:nth-child(2) { top: 14px; }
    .whiskers i:nth-child(3) { top: 24px; transform: rotate(-8deg); }

    .paw { position: absolute; z-index: 5; top: 133px; width: 77px; height: 42px; border: 0; border-radius: 50%; background-color: var(--cat); box-shadow: 0 5px 9px rgba(105,55,39,.14); }
    .paw.one { left: 118px; transform: rotate(4deg); }
    .paw.two { left: 172px; transform: rotate(-5deg); }
    .hind-paw {
      position: absolute;
      right: 72px;
      top: 142px;
      z-index: 5;
      width: 72px;
      height: 37px;
      border-radius: 54% 58% 45% 48%;
      background: var(--cat);
      box-shadow: 0 5px 9px rgba(105,55,39,.13);
      transform: rotate(3deg);
    }
    .hind-paw::before,
    .hind-paw::after {
      content: "";
      position: absolute;
      top: 9px;
      width: 2px;
      height: 13px;
      border-radius: 2px;
      background: rgba(75,48,45,.45);
    }
    .hind-paw::before { left: 27px; transform: rotate(-7deg); }
    .hind-paw::after { left: 44px; transform: rotate(7deg); }
    .toe { position: absolute; top: 9px; width: 2px; height: 15px; background: rgba(75,48,45,.55); }
    .toe.a { left: 27px; transform: rotate(-7deg); } .toe.b { left: 44px; transform: rotate(7deg); }

    .tail {
      position: absolute;
      right: -18px;
      top: 8px;
      width: 158px;
      height: 137px;
      border: 31px solid var(--cat);
      border-left-color: transparent;
      border-radius: 50%;
      background: transparent;
      transform-origin: 25px 105px;
      z-index: 2;
      filter: drop-shadow(0 8px 7px rgba(92, 47, 34, .15));
      box-shadow: none;
      animation: tailSwing 4.2s cubic-bezier(.45, .05, .25, 1) infinite;
    }

    .tail::after {
      content: "";
      position: absolute;
      left: -14px;
      top: -15px;
      width: 37px;
      height: 37px;
      border-radius: 50%;
      background: var(--cat);
      box-shadow: none;
    }

    @keyframes tailSwing {
      0% {
        transform: rotate(-5deg) translateY(1px) scale(1);
      }
      18% {
        transform: rotate(-1deg) translateY(-1px) scale(1.006);
      }
      42% {
        transform: rotate(6deg) translateY(-3px) scale(1.018);
      }
      58% {
        transform: rotate(7deg) translateY(-3px) scale(1.02);
      }
      78% {
        transform: rotate(1deg) translateY(-1px) scale(1.008);
      }
      100% {
        transform: rotate(-5deg) translateY(1px) scale(1);
      }
    }

    /* The cat-fact control is presented as a clear, clickable coffee cup. */
    .coffee-button {
      position: absolute;
      right: 58px;
      top: -51px;
      width: 112px;
      height: 112px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      z-index: 14;
      transition: transform .2s ease, filter .2s ease;
    }
    .coffee-button:hover { transform: translateY(-4px) rotate(2deg); filter: brightness(1.06); }
    .coffee-button:focus-visible { outline: 4px solid #fff1a8; outline-offset: 5px; }
    .coffee-button:active { transform: translateY(1px) scale(.96); }
    .coffee-cup-svg {
      position: absolute;
      inset: -8px auto auto -8px;
      width: 120px;
      height: 120px;
      overflow: visible;
      pointer-events: none;
      user-select: none;
    }

    .message-card {
      position: absolute; z-index: 15; left: 50%; bottom: 2.1vh; transform: translateX(-50%);
      width: min(88vw, 610px); padding: 11px 17px; border: 2px solid rgba(255,238,198,.65); border-radius: 18px;
      background: rgba(66,40,34,.90); color: #fff0ce; text-align: center; font-family: Arial, sans-serif;
      box-shadow: 0 8px 18px rgba(40,20,15,.25); backdrop-filter: blur(6px);
    }
    #badge { display: block; margin-top: 4px; color: #ffd66b; font-weight: bold; }

    /* Small paw prints follow pointer movement, then shrink and fade away. */
    .cursor-paw {
      position: fixed;
      z-index: 35;
      width: 18px;
      height: 18px;
      pointer-events: none;
      color: rgba(120, 72, 62, .62);
      transform: translate(-50%, -50%) rotate(var(--paw-angle, 0deg)) scale(.75);
      filter: drop-shadow(0 2px 2px rgba(68, 37, 31, .10));
      animation: cursorPawFade .9s ease-out forwards;
    }
    .cursor-paw svg { display: block; width: 100%; height: 100%; fill: currentColor; }
    @keyframes cursorPawFade {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--paw-angle, 0deg)) scale(.55); }
      18% { opacity: .78; transform: translate(-50%, -50%) rotate(var(--paw-angle, 0deg)) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -58%) rotate(var(--paw-angle, 0deg)) scale(.7); }
    }

    /* Small light-pink SVG hearts appear at the exact petting point and softly disappear. */
    .pet-heart {
      position: fixed;
      z-index: 40;
      width: var(--heart-size, 22px);
      height: var(--heart-size, 22px);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.35) rotate(var(--heart-rotation, 0deg));
      opacity: 0;
      filter: drop-shadow(0 3px 3px rgba(185, 107, 134, .18));
      animation: heartFloat var(--heart-duration, 1.35s) ease-out forwards;
    }
    @keyframes heartFloat {
      12% { opacity: .95; transform: translate(-50%, -50%) scale(1) rotate(var(--heart-rotation, 0deg)); }
      70% { opacity: .75; }
      100% {
        opacity: 0;
        transform: translate(
          calc(-50% + var(--heart-x, 0px)),
          calc(-50% + var(--heart-y, -75px))
        ) scale(.55) rotate(calc(var(--heart-rotation, 0deg) + 18deg));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .pet-heart { animation-duration: .45s; }
      .cursor-paw { display: none; }
    }
    .purr { animation: happyBounce .45s ease 2; }
    @keyframes happyBounce { 50% { transform: translateX(-50%) translateY(-10px) rotate(-2deg); } }

    .morning .window { background: linear-gradient(#72bce5 0%, #ffdfac 68%, #efa875); }
    .afternoon .window { background: linear-gradient(#65bdec 0%, #bce7f1 65%, #f7dfb6); }
    .evening .window { background: linear-gradient(#715b9d 0%, #e48179 55%, #f4ac65); }
    .night .window { background: linear-gradient(#111b3a 0%, #263f67 70%, #3d4564); }
    .evening .sun-moon { left: 72%; top: 37%; background: #ffd18a; box-shadow: 0 0 38px #ffad6a; }
    .night .sun-moon { left: 75%; top: 13%; background: #f7f2d5; box-shadow: 0 0 28px rgba(241,239,202,.75); }
    .night .sun-moon::after { content: ""; position: absolute; width: 54px; height: 54px; left: -13px; top: -7px; border-radius: 50%; background: #182848; }
    .night .stars, .evening .stars { opacity: 1; }
    .night .cloud { opacity: .22; }
    .night.cafe { background: linear-gradient(#765a61, #4f3943); }
    .evening.cafe { background: linear-gradient(#d0a487, #a46765); }

    @media (max-width: 720px) {
      .lamp.right, .plant.right, .plant-table.right, .shelf { display: none; }
      .header { width: 88vw; height: 112px; }
      .lamp.left { left: 2%; transform: scale(.75); transform-origin: top; }
      .clock-board { top: 125px; right: 1.5%; min-width: 155px; padding: 8px; }
      .window-wrap { top: 112px; width: 92vw; height: 310px; }
      .plant.left {
        bottom: calc(8vh + 79px);
        left: 0;
        transform: scale(.75);
        transform-origin: bottom center;
      }
      .plant-table.left {
        bottom: 8vh;
        left: 0;
        transform: scale(.75);
        transform-origin: bottom left;
      }
      .counter { bottom: 10vh; height: 185px; }
      .cat-button { transform: translateX(-50%) scale(.76); transform-origin: center bottom; top: -127px; }
      .cat-button.purr { animation: mobileBounce .45s ease 2; }
      @keyframes mobileBounce { 50% { transform: translateX(-50%) scale(.76) translateY(-10px) rotate(-2deg); } }
      .coffee-button { right: 28px; transform: scale(.8); }
      .message-card { bottom: 1.5vh; font-size: .88rem; }
      .subtitle { font-size: .85rem; }
    }
  </style>
</head>
<body>
  <main class="cafe" id="cafe">
    <header class="header">
      <h1>Time for a Catnap</h1>
      <p class="subtitle">Time passes more softly with paws and coffee</p>
    </header>

    <div class="lamp left" aria-hidden="true"><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>
    <div class="lamp right" aria-hidden="true"><div class="cord"></div><div class="shade"></div><div class="bulb"></div></div>

    <section class="window-wrap" aria-label="Cafe window showing the current time of day">
      <div class="window">
        <div class="sun-moon"></div>
        <div class="stars"><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span></div>
        <div class="cloud one"></div><div class="cloud two"></div><div class="city"></div>
      </div>
    </section>

    <div class="shelf" aria-hidden="true"><span class="shelf-item jar1"></span><span class="shelf-item jar2"></span><span class="shelf-item cups"></span></div>
    <div class="plant left" aria-hidden="true"><span class="leaf a"></span><span class="leaf b"></span><span class="leaf c"></span><span class="pot"></span></div>
    <div class="plant right" aria-hidden="true"><span class="leaf a"></span><span class="leaf b"></span><span class="leaf c"></span><span class="pot"></span></div>
    <div class="plant-table left" aria-hidden="true"><span class="tabletop"></span><span class="leg one"></span><span class="leg two"></span><span class="brace"></span></div>
    <div class="plant-table right" aria-hidden="true"><span class="tabletop"></span><span class="leg one"></span><span class="leg two"></span><span class="brace"></span></div>

    <aside class="clock-board" aria-live="polite">
      <small>CAFE TIME</small>
      <div id="clock">--:--:--</div>
      <div id="period">Welcome in</div>
    </aside>

    <section class="counter" aria-label="Cafe counter">
      <button class="cat-button" id="cat" aria-label="Pet the sleepy orange cat">
        <span class="tail" aria-hidden="true"></span>
        <span class="cat-body" aria-hidden="true"><i class="stripe s1"></i><i class="stripe s2"></i><i class="stripe s3"></i><i class="stripe s4"></i></span>
        <span class="cat-head" aria-hidden="true">
          <i class="ear left"></i><i class="ear right"></i><i class="forehead-mark left"></i><i class="forehead-mark center"></i><i class="forehead-mark right"></i>
          <i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i>
          <i class="cheek left"></i><i class="cheek right"></i>
          <span class="whiskers left"><i></i><i></i><i></i></span><span class="whiskers right"><i></i><i></i><i></i></span>
        </span>
        <span class="paw one" aria-hidden="true"><i class="toe a"></i><i class="toe b"></i></span>
        <span class="paw two" aria-hidden="true"><i class="toe a"></i><i class="toe b"></i></span>
        <span class="hind-paw" aria-hidden="true"></span>
      </button>

      <button class="coffee-button" id="coffee" aria-label="Click the coffee cup for a cat fact" title="Click for a cat fact">
<svg class="coffee-cup-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-labelledby="title description">
  <title id="title">Cozy coffee cup</title>
  <desc id="description">A rounded sage green coffee cup filled with warm coffee, a cream paw-shaped foam design, and three softly animated curls of steam.</desc>

  <defs>
    <linearGradient id="cupFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fc5b8"/>
      <stop offset="1" stop-color="#6f9d91"/>
    </linearGradient>
    <linearGradient id="cupShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#416b62" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="coffeeFill" cx="48%" cy="38%" r="64%">
      <stop offset="0" stop-color="#7e4e38"/>
      <stop offset="1" stop-color="#4d2e23"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#3e251d" flood-opacity="0.23"/>
    </filter>
    <filter id="steamBlur" x="-60%" y="-30%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Soft animated steam keeps the cup feeling warm and clickable. -->
  <g fill="none" stroke="#fff7e8" stroke-linecap="round" filter="url(#steamBlur)" opacity="0.76">
    <path d="M82 75 C62 55 99 43 81 20" stroke-width="7">
      <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
        values="M82 75 C62 55 99 43 81 20; M82 75 C105 54 65 43 86 18; M82 75 C62 55 99 43 81 20"/>
      <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.25;0.9;0.25"/>
    </path>
    <path d="M120 69 C102 50 137 39 119 13" stroke-width="8">
      <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
        values="M120 69 C102 50 137 39 119 13; M120 69 C145 49 103 38 126 11; M120 69 C102 50 137 39 119 13"/>
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0.3;0.95;0.3"/>
    </path>
    <path d="M156 75 C137 57 172 45 154 23" stroke-width="7">
      <animate attributeName="d" dur="3s" repeatCount="indefinite"
        values="M156 75 C137 57 172 45 154 23; M156 75 C179 57 141 45 162 21; M156 75 C137 57 172 45 154 23"/>
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.2;0.82;0.2"/>
    </path>
  </g>

  <g filter="url(#softShadow)">
    <!-- The handle sits behind the cup so the silhouette remains clean. -->
    <path d="M179 116 C221 111 226 176 184 181 C169 183 163 170 174 160 C184 167 197 163 199 150 C201 135 188 128 178 134 Z"
      fill="url(#cupFill)"/>

    <!-- Cup body uses no hard line art, matching the soft café illustration. -->
    <path d="M43 105 C43 91 54 83 68 83 H177 C191 83 197 93 195 107 L186 176 C183 199 166 215 143 215 H94 C70 215 54 201 51 177 Z"
      fill="url(#cupFill)"/>
    <path d="M54 111 H185 L177 175 C175 193 161 204 143 204 H95 C77 204 65 194 62 176 Z"
      fill="url(#cupShade)" opacity="0.5"/>

    <!-- Coffee surface. -->
    <ellipse cx="119" cy="105" rx="70" ry="25" fill="#d9eee6"/>
    <ellipse cx="119" cy="106" rx="62" ry="19" fill="url(#coffeeFill)"/>
    <ellipse cx="105" cy="100" rx="31" ry="8" fill="#ffffff" opacity="0.12"/>

    <!-- A small paw-shaped foam design connects the drink to the cat café. -->
    <g fill="#f7e4c2" opacity="0.92" transform="translate(119 106) rotate(-6)">
      <ellipse cx="0" cy="5" rx="15" ry="10"/>
      <circle cx="-14" cy="-6" r="5"/>
      <circle cx="-5" cy="-11" r="5"/>
      <circle cx="6" cy="-11" r="5"/>
      <circle cx="15" cy="-5" r="5"/>
    </g>

    <!-- Gentle highlight adds depth without outlining the cup. -->
    <path d="M68 127 C69 166 77 187 98 196" fill="none" stroke="#e9fff7" stroke-width="8" stroke-linecap="round" opacity="0.24"/>
  </g>

  <!-- A soft counter shadow visually grounds the cup. -->
  <ellipse cx="122" cy="222" rx="77" ry="9" fill="#3e251d" opacity="0.13"/>
</svg>

      </button>
    </section>

    <div class="message-card" aria-live="polite">
      <span id="message">Pet the cat or click the coffee mug for a surprise.</span>
      <span id="badge"></span>
    </div>
  </main>

  <script>
    // Store the interactive page elements so the script can update them.
    const cafe = document.getElementById('cafe');
    const clock = document.getElementById('clock');
    const period = document.getElementById('period');
    const cat = document.getElementById('cat');
    const coffee = document.getElementById('coffee');
    const message = document.getElementById('message');
    const badge = document.getElementById('badge');
    let pets = 0;
    let restTimer = null;

    // Return the matching atmosphere and greeting for the current hour.
    function getTimePeriod(hour) {
      if (hour >= 6 && hour < 12) return { theme: 'morning', label: 'Morning pastries and sunbeams' };
      if (hour >= 12 && hour < 18) return { theme: 'afternoon', label: 'A warm afternoon catnap' };
      if (hour >= 18 && hour < 22) return { theme: 'evening', label: 'Golden hour at the cafe' };
      return { theme: 'night', label: 'Moonlight and sleepy purrs' };
    }

    // Update the real clock and change the cafe window based on local time.
    function updateClockAndScene() {
      const now = new Date();
      const current = getTimePeriod(now.getHours());
      clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      period.textContent = current.label;
      cafe.classList.remove('morning', 'afternoon', 'evening', 'night');
      cafe.classList.add(current.theme);
    }

    // Add a lightweight SVG paw trail while a mouse, pen, or touch pointer moves.
    let lastPawTime = 0;
    let lastPawX = 0;
    let lastPawY = 0;
    let pawSide = 1;

    function createCursorPaw(x, y, angle) {
      const paw = document.createElement('span');
      paw.className = 'cursor-paw';
      paw.style.left = `${x}px`;
      paw.style.top = `${y}px`;
      paw.style.setProperty('--paw-angle', `${angle + pawSide * 10}deg`);
      paw.innerHTML = `
        <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <ellipse cx="32" cy="39" rx="16" ry="14"/>
          <ellipse cx="13" cy="25" rx="7" ry="9" transform="rotate(-25 13 25)"/>
          <ellipse cx="26" cy="16" rx="7" ry="9" transform="rotate(-7 26 16)"/>
          <ellipse cx="39" cy="16" rx="7" ry="9" transform="rotate(7 39 16)"/>
          <ellipse cx="52" cy="25" rx="7" ry="9" transform="rotate(25 52 25)"/>
        </svg>`;
      document.body.appendChild(paw);
      pawSide *= -1;
      window.setTimeout(() => paw.remove(), 950);
    }

    // Space out paw prints so the trail stays subtle and performs smoothly.
    document.addEventListener('pointermove', (event) => {
      const now = performance.now();
      const distance = Math.hypot(event.clientX - lastPawX, event.clientY - lastPawY);

      if (now - lastPawTime < 90 || distance < 24) return;

      const angle = Math.atan2(event.clientY - lastPawY, event.clientX - lastPawX) * 180 / Math.PI + 90;
      createCursorPaw(event.clientX, event.clientY, angle);
      lastPawTime = now;
      lastPawX = event.clientX;
      lastPawY = event.clientY;
    }, { passive: true });

    // Release several light-pink SVG hearts from the exact point where the cat is petted.
    function createPetHearts(event) {
      const heartCount = 6;

      for (let index = 0; index < heartCount; index += 1) {
        const heart = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        const heartPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
        const firstStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        const secondStop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        const definitions = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        const gradientId = `pet-heart-gradient-${Date.now()}-${index}`;
        const spread = (index - (heartCount - 1) / 2) * 17 + (Math.random() * 12 - 6);
        const rise = -58 - Math.random() * 48;
        const size = 14 + Math.random() * 13;
        const duration = 1.05 + Math.random() * .55;
        const rotation = -18 + Math.random() * 36;

        heart.setAttribute('viewBox', '0 0 240 220');
        heart.setAttribute('aria-hidden', 'true');
        heart.classList.add('pet-heart');
        heart.style.left = `${event.clientX}px`;
        heart.style.top = `${event.clientY}px`;
        heart.style.setProperty('--heart-x', `${spread}px`);
        heart.style.setProperty('--heart-y', `${rise}px`);
        heart.style.setProperty('--heart-size', `${size}px`);
        heart.style.setProperty('--heart-duration', `${duration}s`);
        heart.style.setProperty('--heart-rotation', `${rotation}deg`);

        gradient.setAttribute('id', gradientId);
        gradient.setAttribute('x1', '0');
        gradient.setAttribute('y1', '0');
        gradient.setAttribute('x2', '1');
        gradient.setAttribute('y2', '1');
        firstStop.setAttribute('offset', '0');
        firstStop.setAttribute('stop-color', '#ffd6e3');
        secondStop.setAttribute('offset', '1');
        secondStop.setAttribute('stop-color', '#f5a9c2');
        gradient.append(firstStop, secondStop);
        definitions.appendChild(gradient);

        heartPath.setAttribute('d', 'M120 202 C102 184 42 145 26 103 C10 61 32 25 70 21 C93 19 111 31 120 49 C129 31 147 19 170 21 C208 25 230 61 214 103 C198 145 138 184 120 202 Z');
        heartPath.setAttribute('fill', `url(#${gradientId})`);
        heart.append(definitions, heartPath);
        document.body.appendChild(heart);
        window.setTimeout(() => heart.remove(), 1800);
      }
    }

    // Wake the cat on every pet, then return it to sleep after five quiet seconds.
    function wakeCatTemporarily() {
      window.clearTimeout(restTimer);
      cat.classList.remove('resting');
      cat.classList.add('awake');

      restTimer = window.setTimeout(() => {
        cat.classList.remove('awake');
        cat.classList.add('resting');

        // Remove the temporary closing class after the closing transition finishes.
        window.setTimeout(() => cat.classList.remove('resting'), 460);
      }, 5000);
    }

    const catResponses = [
      'Purr... the sleepy cafe cat is happy.',
      'The cat makes tiny biscuits on the counter.',
      'A soft meow says, “One more pet, please.”',
      'The cat stretches one paw without waking up.',
      'You hear the gentlest little snore.'
    ];

    const catFacts = [
      'Cats can spend around two-thirds of their lives sleeping.',
      'A cat uses its whiskers to help judge whether it can fit through a space.',
      'Cats can rotate each ear independently to locate sounds.',
      'A relaxed cat may slowly blink as a friendly signal.',
      'A group of cats can be called a clowder.'
    ];

    // Pet the cat, show a random response, and unlock an achievement after ten pets.
    cat.addEventListener('click', (event) => {
      pets += 1;
      wakeCatTemporarily();
      message.textContent = catResponses[Math.floor(Math.random() * catResponses.length)];
      createPetHearts(event);
      cat.classList.remove('purr');
      void cat.offsetWidth;
      cat.classList.add('purr');
      if (pets >= 10) badge.textContent = '🏆 Achievement unlocked: Official Cafe Cat Manager';
    });

    // Show a random cat fact when the coffee mug is clicked.
    coffee.addEventListener('click', () => {
      message.textContent = `☕ Cat fact: ${catFacts[Math.floor(Math.random() * catFacts.length)]}`;
    });

    // Start the clock immediately and keep it accurate once per second.
    updateClockAndScene();
    window.setInterval(updateClockAndScene, 1000);
  </script>
</body>
</html>
