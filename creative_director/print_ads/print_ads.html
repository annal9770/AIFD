<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOKORO WEAR // Spring 2027 Campaign Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF7F2;
      --text: #2B211B;
      --accent: #E8A8B8;
      --indigo: #1A2B3C;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Source Sans Pro', sans-serif;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }
    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .sparkle {
      position: absolute;
      color: var(--accent);
      opacity: .25;
      font-size: 18px;
      animation: twinkle 6s ease-in-out infinite;
    }
    .sparkle:nth-child(2n) { animation-duration: 8s; }
    .sparkle:nth-child(3n) { animation-duration: 5s; }
    .sparkle:nth-child(4n) { animation-delay: -3s; }
    .sparkle:nth-child(5n) { animation-delay: -5s; }
    @keyframes twinkle {
      0%, 100% { opacity: .15; transform: scale(.7) rotate(0deg); }
      50% { opacity: .4; transform: scale(1.15) rotate(12deg); }
    }
    .wrapper {
      max-width: 1200px;
      margin: auto;
      padding: 80px 24px;
      position: relative;
      z-index: 1;
    }
    .brand-tag {
      text-align: center;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #9D8870;
      margin-bottom: 12px;
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-size: clamp(48px, 7vw, 84px);
      text-align: center;
      margin: 0;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }
    .sub {
      text-align: center;
      font-size: 20px;
      color: #555;
      margin: 16px 0 64px;
      font-weight: 400;
      letter-spacing: 0.05em;
    }

    /* Gallery Grid Setup (3 top, 2 bottom centered) */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 36px;
    }
    .card {
      grid-column: span 2;
      background: #fff;
      padding: 16px;
      border-radius: 28px;
      box-shadow: 0 8px 30px rgba(43, 33, 27, 0.06);
      border: 1px solid rgba(157, 136, 112, 0.2);
      transition: transform .3s ease, box-shadow .3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 42px rgba(43, 33, 27, 0.12);
    }
    .card:nth-child(4) {
      grid-column: 2 / span 2;
    }
    .card:nth-child(5) {
      grid-column: 4 / span 2;
    }

    .thumb-wrap {
      width: 100%;
      height: 420px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #f0e9df;
      cursor: pointer;
    }
    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease-out, filter .4s ease-out;
      display: block;
    }
    .thumb:hover {
      transform: scale(1.035);
      filter: brightness(1.03);
    }
    .label {
      margin-top: 20px;
      padding: 0 8px 8px;
      font-family: 'Source Sans Pro', sans-serif;
    }
    .label-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .num {
      background: var(--accent);
      color: var(--text);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 99px;
      letter-spacing: 0.05em;
    }
    .label-desc {
      font-size: 13px;
      color: #75848F;
      margin-top: 4px;
    }

    /* Lightbox Modal */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 43, 60, 0.94);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 40px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .lightbox img {
      max-width: 85vw;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .lightbox-caption {
      color: #FAF7F2;
      margin-top: 16px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .close {
      position: absolute;
      top: -10px;
      right: -10px;
      color: #FAF7F2;
      background: rgba(255, 255, 255, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      user-select: none;
    }
    .close:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: var(--text);
      font-size: 36px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, background .2s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .nav-arrow:hover {
      transform: translateY(-50%) scale(1.08);
      background: #f2bec8;
    }
    .prev { left: -80px; }
    .next { right: -80px; }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .card, .card:nth-child(4), .card:nth-child(5) {
        grid-column: span 1;
      }
      .prev { left: 10px; }
      .next { right: 10px; }
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .card, .card:nth-child(4), .card:nth-child(5) {
        grid-column: span 1;
      }
      .thumb-wrap {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="left:7%;top:12%">✦</span>
    <span class="sparkle" style="left:18%;top:67%">✧</span>
    <span class="sparkle" style="left:31%;top:26%">✦</span>
    <span class="sparkle" style="left:44%;top:82%">✧</span>
    <span class="sparkle" style="left:58%;top:16%">✦</span>
    <span class="sparkle" style="left:69%;top:55%">✧</span>
    <span class="sparkle" style="left:83%;top:32%">✦</span>
    <span class="sparkle" style="left:92%;top:75%">✧</span>
    <span class="sparkle" style="left:12%;top:90%">✦</span>
    <span class="sparkle" style="left:76%;top:91%">✦</span>
  </div>

  <div class="wrapper">
    <div class="brand-tag">Kokoro Wear (心・衣) // New York</div>
    <h1>KOKORO WEAR CAMPAIGN</h1>
    <p class="sub">Spring 2027 Print, Editorial & OOH Advertising Portfolio</p>

    <!-- Gallery Grid for the 5 Campaign Ads -->
    <div id="gallery" class="grid"></div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lb" class="lightbox">
    <div class="lightbox-content">
      <div id="close" class="close" title="Close (Esc)">×</div>
      <button id="prev" class="nav-arrow prev" aria-label="Previous image">‹</button>
      <img id="big" alt="Campaign Ad Full View">
      <button id="next" class="nav-arrow next" aria-label="Next image">›</button>
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>
  </div>

  <script>
    // Campaign ads dataset with exact filenames and descriptions
    const ads = [
      {
        src: 'print_ad1.jfif',
        num: '01',
        title: 'Magazine Cover',
        desc: 'Street Smart Wabi-Sabi Denim & Shelter Partnership'
      },
      {
        src: 'print_ad2.jfif',
        num: '02',
        title: 'Subway Car Wrap',
        desc: 'Linear Zoetrope Running Cat & Apparel Cutouts'
      },
      {
        src: 'print_ad3.jfif',
        num: '03',
        title: 'Times Square Billboard',
        desc: 'Cats in the City S/S 2027 OOH Feature'
      },
      {
        src: 'print_ad4.jfif',
        num: '04',
        title: 'Subway Seat Ad',
        desc: 'Haori Collection Featuring Sleeping Cat on Transit Bench'
      },
      {
        src: 'print_ad5.jfif',
        num: '05',
        title: 'Subway Station Billboard',
        desc: 'Hoodie Noun Definition & Artisan Craft Messaging'
      }
    ];

    let currentIndex = 0;
    const gallery = document.getElementById('gallery');
    const lb = document.getElementById('lb');
    const bigImg = document.getElementById('big');
    const captionEl = document.getElementById('lightboxCaption');

    // Populate gallery grid
    ads.forEach((ad, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb-wrap" data-index="${i}">
          <img class="thumb" src="${ad.src}" alt="${ad.title}">
        </div>
        <div class="label">
          <div class="label-title">
            <span>${ad.title}</span>
            <span class="num">${ad.num}</span>
          </div>
          <div class="label-desc">${ad.desc}</div>
        </div>
      `;
      card.querySelector('.thumb-wrap').onclick = () => openLightbox(i);
      gallery.appendChild(card);
    });

    function openLightbox(index) {
      currentIndex = index;
      updateLightboxContent();
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateLightboxContent() {
      const current = ads[currentIndex];
      bigImg.src = current.src;
      bigImg.alt = current.title;
      captionEl.textContent = `${current.num} // ${current.title} — ${current.desc}`;
    }

    function showImage(step) {
      currentIndex = (currentIndex + step + ads.length) % ads.length;
      updateLightboxContent();
    }

    // Event Listeners
    document.getElementById('prev').onclick = (e) => { e.stopPropagation(); showImage(-1); };
    document.getElementById('next').onclick = (e) => { e.stopPropagation(); showImage(1); };
    document.getElementById('close').onclick = closeLightbox;
    
    lb.onclick = (e) => {
      if (e.target === lb) closeLightbox();
    };

    document.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') showImage(-1);
      if (e.key === 'ArrowRight') showImage(1);
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
